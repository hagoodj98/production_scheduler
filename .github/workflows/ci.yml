name: Production Scheduler CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-scheduler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type Check, Unit + E2E, Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-only-session-secret-for-playwright-tests-32-bytes
      JOHN_ADMIN_PASSWORD: password123
      JANE_ADMIN_PASSWORD: password456
      MICHAEL_ADMIN_PASSWORD: password789
      WILLIAM_ADMIN_PASSWORD: password202
      EMILY_ADMIN_PASSWORD: password101
      OLIVIA_ADMIN_PASSWORD: password303
      JOHN_ADMIN_EMAIL: john.doe@example.com
      JANE_ADMIN_EMAIL: jane.smith@example.com
      MICHAEL_ADMIN_EMAIL: michael.johnson@example.com
      WILLIAM_ADMIN_EMAIL: william.brown@example.com
      EMILY_ADMIN_EMAIL: emily.davis@example.com
      OLIVIA_ADMIN_EMAIL: olivia.wilson@example.com
      CREATE_ASSIGN_ADMIN_ACCESS_KEY: create_assign_admin_access_key
      ALL_ACCESS_ADMIN_ACCESS_KEY: all_access_admin_access_key
      RESCHEDULE_TASK_ADMIN_ACCESS_KEY: reschedule_task_admin_access_key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # NOTE: `npm ci` uses package-lock.json and will fail if it’s out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run --if-present prisma:generate

      - name: Type check
        run: npm run --if-present type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed E2E resources and user accounts
        run: npm run db:seed

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
